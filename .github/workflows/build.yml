name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the .clap to tagged releases

jobs:
  windows:
    name: Windows (.clap)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit + host tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: CLAP validator
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://github.com/free-audio/clap-validator/releases/download/0.3.2/clap-validator-0.3.2-windows.zip -OutFile cv.zip
          Expand-Archive cv.zip -DestinationPath cv
          $exe = Get-ChildItem cv -Recurse -Filter clap-validator.exe | Select-Object -First 1
          & $exe.FullName validate build/Release/400Scalper.clap
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: 400Scalper-windows
          path: build/Release/400Scalper.clap
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Release/400Scalper.clap

  linux:
    name: Linux (DSP tests + validator, no UI)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Tests
        run: ctest --test-dir build --output-on-failure
      - name: CLAP validator
        run: |
          curl -sSL -o cv.tar.gz https://github.com/free-audio/clap-validator/releases/download/0.3.2/clap-validator-0.3.2-ubuntu-18.04.tar.gz
          mkdir cv && tar xzf cv.tar.gz -C cv
          ./cv/clap-validator validate build/400Scalper.clap
