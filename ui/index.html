<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>400Scalper</title>
<style>
@font-face{font-family:'Sui Generis';src:url(fonts/SuiGenerisRg-Regular.ttf) format('truetype');font-display:swap}
:root{--accent:#FF6A13;--grey:#8A8A8A}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#050505;color:#E6E6E6;font-family:'Sui Generis',system-ui,sans-serif;-webkit-text-size-adjust:100%}
button{font-family:'Sui Generis',sans-serif}
.plugin{position:relative;width:100vw;height:100vh;min-width:640px;min-height:420px;background:#0D0D0D;border:none;border-radius:0;overflow:hidden;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none}
.hdr{height:48px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 20px;background:#090909;border-bottom:1px solid #1F1F1F}
.word{position:relative}
.wbtn{display:flex;align-items:center;gap:0;padding:4px 6px;margin-left:-6px;border:none;border-radius:5px;background:transparent;color:#E6E6E6;font-size:22px;letter-spacing:.02em;white-space:nowrap;cursor:pointer}
.wbtn span{color:var(--accent)}
.wbtn:focus{outline:none}
.wbtn:focus-visible{outline:1px solid #3A3A3A;outline-offset:2px}
.pop{position:absolute;left:-6px;top:42px;z-index:20;width:208px;padding:12px;background:#141414;border:1px solid #333;border-radius:6px;display:none;flex-direction:column;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.6)}
.pop.open{display:flex}
.pop h3{margin:0;font-size:10px;font-weight:400;letter-spacing:.12em;color:#8C8C8C}
.wheel{position:relative;width:184px;height:184px;touch-action:none;cursor:crosshair}
.wheel canvas{width:184px;height:184px;border-radius:92px}
.wheel .mk{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:7px;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.6);pointer-events:none}
.prow{display:flex;align-items:center;gap:8px;font-size:9px;letter-spacing:.1em;color:#8C8C8C}
.prow input[type=range]{flex:1;width:auto}
.sw{width:24px;height:24px;border-radius:4px;border:1px solid #333;background:var(--accent);flex-shrink:0}
.hex{width:76px;height:26px;padding:0 6px;border:1px solid #333;border-radius:4px;background:#0D0D0D;color:#E6E6E6;font:11px 'Sui Generis',sans-serif;letter-spacing:.04em}
.rst{height:26px;padding:0 8px;border:1px solid #333;border-radius:4px;background:#1A1A1A;color:#BDBDBD;font-size:9px;letter-spacing:.08em;cursor:pointer}
.vh{position:absolute;left:-9999px}
.seg{display:flex;padding:3px;gap:2px;background:#121212;border:1px solid #262626;border-radius:6px}
.seg button{height:26px;padding:0 12px;border:none;border-radius:4px;background:transparent;color:#8C8C8C;font-size:11px;letter-spacing:.08em;cursor:pointer}
.seg button[aria-pressed=true]{background:#262626;color:var(--accent)}
.clip{display:flex;align-items:center;gap:16px;font-size:11px;letter-spacing:.08em;color:#8C8C8C}
.clip .dot{width:8px;height:8px;border-radius:4px;background:#2A2A2A;display:inline-block}
.clip .val{color:#E6E6E6;min-width:64px;text-align:right;font-variant-numeric:tabular-nums}
.mid{flex:1;min-height:0;padding:14px 16px 0;display:flex;gap:10px}
.meter{width:34px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:9px}
.meter .lbl{height:12px;letter-spacing:.1em;color:#8C8C8C}
.meter canvas{width:22px;flex:1;min-height:0;background:#070707;border:1px solid #1F1F1F;border-radius:3px}
.meter .pk{height:12px;color:#E6E6E6;font-variant-numeric:tabular-nums;white-space:nowrap}
.scope{position:relative;flex:1;min-width:0;background:#070707;border:1px solid #1F1F1F;border-radius:6px;overflow:hidden;touch-action:none}
.scope canvas{position:absolute;left:0;top:0}
.gutter{position:absolute;right:0;top:0;bottom:0;width:40px;border-left:1px solid #1A1A1A;background:#0A0A0A}
.tick{position:absolute;right:6px;width:30px;font-size:9px;line-height:12px;color:#8C8C8C;text-align:right;font-variant-numeric:tabular-nums}
.thr{position:absolute;left:0;height:20px;padding:0;margin:0;border:none;background:transparent;cursor:ns-resize;touch-action:none}
.thr span{position:absolute;right:6px;top:-7px;padding:3px 6px;border-radius:3px;background:#1C1C1C;border:1px solid #333;font-size:10px;color:#E6E6E6;white-space:nowrap}
.scopetag{position:absolute;left:8px;top:8px;padding:3px 7px;border-radius:3px;background:rgba(18,18,18,.92);border:1px solid #333;font-size:9px;letter-spacing:.08em;color:var(--accent);display:none}
.tools{position:absolute;left:8px;bottom:8px;display:flex;align-items:center;gap:6px;font-size:9px;letter-spacing:.08em;color:#8C8C8C}
.grp{display:flex;align-items:center;background:rgba(18,18,18,.92);border:1px solid #262626;border-radius:5px;height:30px;padding:0 8px;gap:6px}
.grp label{color:#8C8C8C}
.grp span{min-width:44px;text-align:right;color:#E6E6E6;font-variant-numeric:tabular-nums}
.grp span.z{min-width:30px}
input[type=range]{-webkit-appearance:none;appearance:none;width:84px;height:20px;margin:0;background:transparent;cursor:pointer;touch-action:none}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:linear-gradient(to right,var(--accent) var(--p,0%),#333 var(--p,0%))}
input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:#333}
input[type=range]::-moz-range-progress{height:3px;border-radius:2px;background:var(--accent)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;margin-top:-4.5px;border-radius:6px;background:#E6E6E6;border:none}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:6px;background:#E6E6E6;border:none}
input[type=range]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tbtn{height:30px;padding:0 8px;border:1px solid #262626;border-radius:5px;background:rgba(18,18,18,.92);color:#BDBDBD;cursor:pointer;font-size:9px;letter-spacing:.08em}
.tbtn[aria-pressed=true]{color:var(--accent);border-color:var(--accent)}
.foot{height:178px;flex-shrink:0;display:flex;align-items:center;gap:8px;padding:0 14px}
.kn{display:flex;flex-direction:column;align-items:center;gap:6px;width:80px;flex-shrink:0}
.kn .lbl{font-size:10px;letter-spacing:.12em;color:#8C8C8C;white-space:nowrap}
.kn .lbl b{color:var(--accent);font-weight:400}
.kn button{width:64px;height:64px;padding:0;border:none;background:transparent;cursor:ns-resize;border-radius:32px;touch-action:none}
.kn .v{font-size:11px;color:#E6E6E6;font-variant-numeric:tabular-nums}
.curve{display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0}
.curve span{font-size:10px;letter-spacing:.12em;color:#8C8C8C}
.curve canvas{width:84px;height:84px;background:#070707;border:1px solid #1F1F1F;border-radius:4px}
/* multiband panel */
.mb{flex:1;min-width:220px;height:150px;display:flex;flex-direction:column;gap:5px}
.mbh{height:22px;display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:9px;letter-spacing:.1em;color:#8C8C8C;white-space:nowrap}
.mbh>span{overflow:hidden;text-overflow:ellipsis}
.mbh .sel{color:var(--accent)}
.slope{display:flex;padding:2px;gap:1px;background:#121212;border:1px solid #262626;border-radius:4px}
.slope button{height:18px;padding:0 5px;white-space:nowrap;border:none;border-radius:3px;background:transparent;color:#8C8C8C;font-size:9px;letter-spacing:.04em;cursor:pointer}
.slope button[aria-pressed=true]{background:#262626;color:var(--accent)}
.spec{position:relative;flex:1;min-height:0;background:#070707;border:1px solid #1F1F1F;border-radius:4px;overflow:hidden;touch-action:none}
.spec canvas{position:absolute;left:0;top:0}
.band{position:absolute;top:0;bottom:0;border:none;padding:0;margin:0;background:transparent;cursor:pointer}
.band span{position:absolute;left:50%;bottom:3px;transform:translateX(-50%);font-size:9px;color:#8C8C8C}
.band[aria-pressed=true] span{color:var(--accent)}
.xo{position:absolute;top:0;bottom:0;width:16px;margin-left:-8px;border:none;padding:0;background:transparent;cursor:ew-resize;touch-action:none}
.xo::after{content:'';position:absolute;left:7px;top:0;bottom:0;width:2px;background:#E6E6E6;opacity:.75}
.xo span{position:absolute;top:24px;left:11px;padding:1px 4px;border-radius:2px;background:#1C1C1C;border:1px solid #333;font-size:8px;color:#E6E6E6;white-space:nowrap}
.xo.flip span{left:auto;right:11px}
.solo{position:absolute;top:3px;width:18px;height:18px;margin-left:-21px;padding:0;border:1px solid #3A3A3A;border-radius:3px;background:#161616;color:#BDBDBD;font-size:9px;line-height:16px;cursor:pointer;z-index:2}
.solo[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#0D0D0D}
.edge{position:absolute;top:50%;width:14px;height:34px;margin-top:-17px;border:1px solid #333;background:#161616;color:#BDBDBD;font-size:11px;line-height:1;padding:0;cursor:ew-resize;touch-action:none}
.edge.l{left:0;border-left:none;border-radius:0 4px 4px 0}
.edge.r{right:0;border-right:none;border-radius:4px 0 0 4px}
.edge[hidden]{display:none}
.ctx{position:absolute;z-index:5;display:none;flex-direction:column;background:#161616;border:1px solid #333;border-radius:4px;padding:3px;min-width:120px}
.ctx button{height:24px;padding:0 8px;text-align:left;border:none;border-radius:3px;background:transparent;color:#E6E6E6;font-size:9px;letter-spacing:.06em;cursor:pointer}
.ctx button:hover,.ctx button:focus-visible{background:#262626;outline:none}
.ctx button[disabled]{color:#5A5A5A;cursor:default}
/* compact layout for small plugin windows */
@media (max-width: 820px) {
  .foot{gap:6px;padding:0 10px}
  .kn{width:66px}
  .kn .lbl{font-size:9px;letter-spacing:.06em}
  .curve canvas{width:70px;height:70px}
  .mb{min-width:160px}
  input[type=range]{width:56px}
  .grp{padding:0 6px;gap:4px}
  .grp span{min-width:36px}
  .grp span.z{min-width:24px}
  .tbtn{padding:0 6px}
  .tools{gap:4px}
  .sch>span:first-child{display:none}
}
/* ---- Spectral mode ---- */
:root{--comp:#13A8FF}
.foot{position:relative}
.modetag{position:absolute;left:14px;top:6px;font-size:9px;letter-spacing:.14em;color:var(--accent);display:none}
.plugin.spectral .foot{background:#111;box-shadow:inset 0 1px 0 var(--accent)}
.plugin.spectral .modetag{display:block}
.plugin.spectral .mb{display:none}
.plugin.spectral #slotRest{flex:1;min-width:0}
.kn.detailKn{display:none}
.plugin.spectral .kn.detailKn{display:flex}
.sc{display:none;flex:1;min-width:150px;height:150px;flex-direction:column;gap:5px}
.plugin.spectral .sc{display:flex}
.sch{height:22px;display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:9px;letter-spacing:.1em;color:#8C8C8C;white-space:nowrap;overflow:hidden}
.sch .lg{display:flex;gap:10px;align-items:center}
.sch .lg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.scbox{position:relative;flex:1;min-height:0;background:#070707;border:1px solid #2A2A2A;border-radius:4px;overflow:hidden}
.scbox canvas{position:absolute;left:0;top:0}
.switching{position:absolute;right:14px;top:6px;font-size:9px;letter-spacing:.1em;color:#8C8C8C;display:none}
</style>
</head>
<body>
<div class="plugin" id="plugin">
        <div class="hdr">
          <div class="word">
            <button type="button" class="wbtn" id="wbtn" aria-haspopup="dialog" aria-expanded="false" aria-controls="pop" aria-label="400Scalper, change accent color"><span>400</span>SCALPER</button>
            <div class="pop" id="pop" role="dialog" aria-label="Accent color">
              <h3>ACCENT COLOR</h3>
              <div class="wheel" id="wheel"><canvas id="wheelCv" aria-hidden="true"></canvas><span class="mk" id="wheelMk"></span></div>
              <div class="prow"><label for="valSl">BRIGHT</label><input id="valSl" type="range" min="20" max="100" step="1"></div>
              <div class="prow"><span class="sw" aria-hidden="true"></span><label for="hexIn" class="vh">Hex color</label><input id="hexIn" class="hex" type="text" maxlength="7" spellcheck="false"><button type="button" class="rst" id="accReset">RESET</button></div>
            </div>
          </div>
          <div class="seg" role="group" aria-label="Clip mode">
            <button type="button" id="mSample" aria-pressed="true">SAMPLE</button>
            <button type="button" id="mSpec" aria-pressed="false">SPECTRAL</button>
          </div>
          <div class="clip">
            <span style="display:flex;align-items:center;gap:8px"><span class="dot" id="clipDot"></span><span id="clipLbl">CLIP</span><span class="val" id="grText">0.0 dB</span></span>
            <svg width="31" height="22" viewBox="328 225 1343 980" role="img" aria-label="Always 400">
              <path d="M328 1160 L1263 225 L1308 225 L1671 1155 L1671 1205 L1320 1205 L1320 1157 L1088 1157 L1267 978 L1267 916 L978 1205 L328 1205 Z" fill="#E6E6E6"/>
              <path d="M1402 225 L1671 225 L1671 916 Z" fill="#E6E6E6"/>
            </svg>
          </div>
        </div>

        <div class="mid">
          <div class="meter"><span class="lbl">IN</span><canvas id="meterIn" aria-hidden="true"></canvas><span class="pk" id="inPk">−∞</span></div>
          <div class="scope" id="scope">
            <canvas id="scopeCv" aria-hidden="true"></canvas>
            <div class="gutter"></div>
            <div id="ticks"></div>
            <span class="scopetag" id="scopeTag">BAND 1</span>
            <button type="button" class="thr" id="thr" aria-label="Threshold, drag up or down"><span id="thrText">−6.0 dB</span></button>
            <div class="tools">
              <div class="grp"><label for="tSl">TIME</label><input id="tSl" type="range" min="0" max="1000" step="1"><span id="tTxt">3.0 s</span></div>
              <div class="grp"><label for="zSl">ZOOM</label><input id="zSl" type="range" min="0" max="1000" step="1"><span id="zTxt" class="z">1×</span></div>
              <button type="button" class="tbtn" id="follow" aria-pressed="true">FOLLOW</button>
              <button type="button" class="tbtn" id="freeze" aria-pressed="false">FREEZE</button>
              <button type="button" class="tbtn" id="fit">FIT</button>
            </div>
          </div>
          <div class="meter"><span class="lbl">OUT</span><canvas id="meterOut" aria-hidden="true"></canvas><span class="pk" id="outPk">−∞</span></div>
        </div>

        <div class="foot" id="foot">
          <span class="modetag">SPECTRAL MODE</span><span class="switching" id="switching">SWITCHING MODE…</span>
          <div id="slotIn"></div>
          <div class="mb">
            <div class="mbh">
              <span id="mbHead">BANDS <span class="sel" id="mbSel"></span></span>
              <div class="slope" role="group" aria-label="Crossover slope">
                <button type="button" data-s="6" aria-pressed="false">6 dB</button>
                <button type="button" data-s="12" aria-pressed="false">12 dB</button>
                <button type="button" data-s="24" aria-pressed="true">24 dB</button>
              </div>
            </div>
            <div class="spec" id="spec">
              <canvas id="specCv" aria-hidden="true"></canvas>
              <div id="bandLayer"></div>
              <button type="button" class="edge l" id="edgeL" aria-label="Drag right to add a low band">‹</button>
              <button type="button" class="edge r" id="edgeR" aria-label="Drag left to add a high band">›</button>
              <div class="ctx" id="ctx" role="menu">
                <button type="button" role="menuitem" id="ctxAdd">ADD BAND HERE</button>
                <button type="button" role="menuitem" id="ctxDel">REMOVE CROSSOVER</button>
                <button type="button" role="menuitem" id="ctxReset">SINGLE BAND</button>
              </div>
            </div>
          </div>
          <div id="slotRest" style="display:flex;align-items:center;gap:8px"></div>
        </div>
</div>
<script>
// 400Scalper — Spectral mode prototype (detail-preserving clipper).
//
// 1. A short STFT (N ≈ 10.7 ms, hop N/4, sqrt-Hann WOLA) is grouped into 26 Mel-spaced
//    "ear" bands with triangular weights.
// 2. Per frame, bands within RANGE dB of the loudest band are LOUD (mask -> 1), quieter
//    bands are DETAIL (mask -> 0). Masks attack instantly and release over ~60 ms.
// 3. The DETAIL signal D is resynthesised from the quiet bins; the loud part is x - D
//    (complementary, so x = L + D exactly).
// 4. Clip only the loud part, against bounds that leave room for the detail:
//       y = d·D + softclip(x - d·D, hi = T - d·D, lo = -T - d·D)
//    -> |y| <= T always; below threshold y = x; while clipping the detail rides through.
// Latency = N samples (frame length).

(function (root) {
  function makeFFT(n) {
    const rev = new Uint32Array(n);
    for (let i = 0, j = 0; i < n; i++) {
      rev[i] = j;
      let bit = n >> 1;
      for (; j & bit; bit >>= 1) j ^= bit;
      j ^= bit;
    }
    const cos = new Float64Array(n / 2), sin = new Float64Array(n / 2);
    for (let i = 0; i < n / 2; i++) { cos[i] = Math.cos(2 * Math.PI * i / n); sin[i] = Math.sin(2 * Math.PI * i / n); }
    return function fft(re, im, inverse) {
      for (let i = 0; i < n; i++) { const j = rev[i]; if (i < j) { let t = re[i]; re[i] = re[j]; re[j] = t; t = im[i]; im[i] = im[j]; im[j] = t; } }
      for (let len = 2; len <= n; len <<= 1) {
        const step = n / len, half = len / 2;
        for (let i = 0; i < n; i += len) {
          for (let j = 0; j < half; j++) {
            const wr = cos[j * step], wi = inverse ? sin[j * step] : -sin[j * step];
            const a = i + j, b = a + half;
            const tr = re[b] * wr - im[b] * wi, ti = re[b] * wi + im[b] * wr;
            re[b] = re[a] - tr; im[b] = im[a] - ti; re[a] += tr; im[a] += ti;
          }
        }
      }
      if (inverse) for (let i = 0; i < n; i++) { re[i] /= n; im[i] /= n; }
    };
  }

  const NB = 26;
  const mel = (f) => 2595 * Math.log10(1 + f / 700);
  const imel = (m) => 700 * (Math.pow(10, m / 2595) - 1);

  function createSpectral(sr) {
    const N = Math.pow(2, Math.round(Math.log2(0.0107 * sr))); // 512 @ 44.1/48k, 1024 @ 88.2/96k
    const H = N / 4, nb = N / 2 + 1;
    const fft = makeFFT(N);
    const win = new Float64Array(N);
    for (let i = 0; i < N; i++) win[i] = Math.sqrt(0.5 - 0.5 * Math.cos(2 * Math.PI * i / N)); // periodic sqrt-Hann
    // Mel band edges 20 Hz .. 20 kHz (clamped to Nyquist), triangular weights per bin
    const fmax = Math.min(20000, sr / 2 * 0.98);
    const edges = []; for (let i = 0; i <= NB + 1; i++) edges.push(imel(mel(20) + (mel(fmax) - mel(20)) * i / (NB + 1)));
    const centers = edges.slice(1, NB + 1);
    const W = []; // W[band] = Float64Array(nb)
    for (let b = 0; b < NB; b++) {
      const w = new Float64Array(nb), lo = edges[b], c = edges[b + 1], hi = edges[b + 2];
      for (let k = 0; k < nb; k++) {
        const f = k * sr / N;
        if (f > lo && f < hi) w[k] = f <= c ? (f - lo) / (c - lo) : (hi - f) / (hi - c);
      }
      // bands narrower than a bin: give them the nearest bin so every band is measurable
      let s = 0; for (let k = 0; k < nb; k++) s += w[k];
      if (s === 0) w[Math.min(nb - 1, Math.round(c * N / sr))] = 1;
      W.push(w);
    }
    const wsum = new Float64Array(nb);
    for (let k = 0; k < nb; k++) { let s = 0; for (let b = 0; b < NB; b++) s += W[b][k]; wsum[k] = s || 1; }

    const inBuf = new Float64Array(N), outAcc = new Float64Array(N + H), xDelay = new Float64Array(N - 1);
    const re = new Float64Array(N), im = new Float64Array(N);
    const bandDb = new Float64Array(NB).fill(-120), mask = new Float64Array(NB), binMask = new Float64Array(nb), dil = new Float64Array(nb);
    let inPos = 0, hopCount = 0, outPos = 0, xdPos = 0;
    const relPerHop = Math.exp(-H / (0.060 * sr));
    const envRel = Math.exp(-1 / (0.015 * sr));
    let env = 0;

    const st = {
      N, H, latency: N - 1, centers, bandDb, mask, binMask, sr,
      range: 15,      // dB below the loudest band that still counts as LOUD
      detail: 1.0,    // 0..1
      process(x, T, knee) {
        // ---- analysis/synthesis of the DETAIL signal ----
        inBuf[inPos] = x; inPos = (inPos + 1) % N;
        if (++hopCount >= H) {
          hopCount = 0;
          for (let i = 0; i < N; i++) { re[i] = inBuf[(inPos + i) % N] * win[i]; im[i] = 0; }
          fft(re, im, false);
          let mx = -120;
          for (let b = 0; b < NB; b++) {
            let e = 0, s = 0; const w = W[b];
            for (let k = 0; k < nb; k++) if (w[k]) { e += w[k] * (re[k] * re[k] + im[k] * im[k]); s += w[k]; }
            const db = 10 * Math.log10(e / (s || 1) + 1e-20);

    }
    ctx.beginPath();
    for (let x = 0; x < w; x++) { const y = yOf(level(x)); if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); }
    ctx.strokeStyle = 'rgba(230,230,230,0.6)'; ctx.lineWidth = 1; ctx.stroke();
  }

  // ---------- meters ----------
  const mIn = { level: -120, hold: -120, holdAt: 0 }, mOut = { level: -120, hold: -120, holdAt: 0 };
  function updMeter(m, peak, dt, t) {
    const db = peak > 1e-6 ? 20 * Math.log10(peak) : -120;
    m.level = db > m.level ? db : Math.max(db, m.level - 24 * dt);
    if (db >= m.hold || t - m.holdAt > 1500) { m.hold = Math.max(db, m.level); m.holdAt = t; }
  }
  const meterY = (db, h) => h - (Math.max(-48, Math.min(6, db)) + 48) / 54 * h;
  function drawMeter(cv, m) {
    const w = 20, h = Math.max(40, cv.parentNode.clientHeight - 36 - 2);
    const ctx = prep(cv, w, h);
    ctx.fillStyle = '#070707'; ctx.fillRect(0, 0, w, h);
    const y0 = meterY(0, h), yl = meterY(m.level, h);
    ctx.fillStyle = '#9A9A9A';
    const yb = Math.max(yl, y0);
    if (yb < h) ctx.fillRect(3, yb, w - 6, h - yb);
    if (yl < y0) { ctx.fillStyle = accent; ctx.fillRect(3, yl, w - 6, y0 - yl); }
    if (m.hold > -48) { ctx.fillStyle = m.hold > 0 ? accent : '#E6E6E6'; ctx.fillRect(3, Math.round(meterY(m.hold, h)), w - 6, 2); }
    ctx.fillStyle = '#3A3A3A';
    [0, -6, -12, -24].forEach((db) => { const y = Math.round(meterY(db, h)); ctx.fillRect(0, y, 2, 1); ctx.fillRect(w - 2, y, 2, 1); });
  }
  const fmtPk = (db) => db <= -60 ? minus + '∞' : ((Math.round(db * 10) / 10 > 0 ? '+' : (db < -0.05 ? minus : '')) + Math.abs(Math.round(db * 10) / 10).toFixed(1));

  // ---------- accent color picker (hidden: click the 400SCALPER wordmark) ----------
  const hsv2rgb = (h, s, v) => {
    const f = (n) => { const k = (n + h / 60) % 6; return v - v * s * Math.max(0, Math.min(k, 4 - k, 1)); };
    return [f(5), f(3), f(1)].map((x) => Math.round(x * 255));
  };
  const rgb2hsv = (r, g, b) => {
    r /= 255; g /= 255; b /= 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
    let h = 0;
    if (d) h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
    return [(h * 60 + 360) % 360, mx ? d / mx : 0, mx];
  };
  const toHex = (rgb) => '#' + rgb.map((x) => x.toString(16).padStart(2, '0')).join('').toUpperCase();
  const fromHex = (hx) => { const m = /^#?([0-9a-f]{6})$/i.exec(String(hx).trim()); if (!m) return null; const n = parseInt(m[1], 16); return [n >> 16, (n >> 8) & 255, n & 255]; };
  let H = 0, S = 1, Vv = 1, accentSaveTimer = 0;
  function applyAccent(rgb, from) {
    accentRGB = rgb; accent = toHex(rgb);
    document.documentElement.style.setProperty('--accent', accent);
    { const [hh, ss, vv] = rgb2hsv(rgb[0], rgb[1], rgb[2]); compRGB = hsv2rgb((hh + 180) % 360, ss, vv); document.documentElement.style.setProperty('--comp', toHex(compRGB)); }
    if (from !== 'hex') $('hexIn').value = accent;
    if (from !== 'wheel' && from !== 'val') { [H, S, Vv] = rgb2hsv(rgb[0], rgb[1], rgb[2]); $('valSl').value = Math.round(Vv * 100); drawWheel(); }
    placeMarker();
    if (from && from !== 'init' && engine) { clearTimeout(accentSaveTimer); accentSaveTimer = setTimeout(() => engine.setAccent(accent), 250); }
  }
  function drawWheel() {
    const cv = $('wheelCv'), N = 184, dpr = Math.min(2, window.devicePixelRatio || 1);
    const px = Math.round(N * dpr);
    cv.width = px; cv.height = px;
    const ctx = cv.getContext('2d'), img = ctx.createImageData(px, px), r0 = px / 2;
    for (let y = 0; y < px; y++) for (let x = 0; x < px; x++) {
      const dx = x - r0 + .5, dy = y - r0 + .5, r = Math.sqrt(dx * dx + dy * dy) / r0;
      const o = (y * px + x) * 4;
      if (r > 1) { img.data[o + 3] = 0; continue; }
      const c = hsv2rgb((Math.atan2(dy, dx) * 180 / Math.PI + 450) % 360, r, Vv);
      img.data[o] = c[0]; img.data[o + 1] = c[1]; img.data[o + 2] = c[2];
      img.data[o + 3] = r > 0.985 ? Math.round((1 - r) / 0.015 * 255) : 255;
    }
    ctx.putImageData(img, 0, 0);
  }
  function placeMarker() {
    const a = (H - 90) * Math.PI / 180, r = S * 92, mk = $('wheelMk');
    mk.style.left = (92 + r * Math.cos(a)) + 'px'; mk.style.top = (92 + r * Math.sin(a)) + 'px';
    mk.style.background = accent;
  }
  (function () {
    const wh = $('wheel'); let drag = false;
    const pick = (e) => {
      const r = wh.getBoundingClientRect();
      const dx = (e.clientX - r.left) - 92, dy = (e.clientY - r.top) - 92;
      H = (Math.atan2(dy, dx) * 180 / Math.PI + 450) % 360;
      S = Math.min(1, Math.sqrt(dx * dx + dy * dy) / 92);
      applyAccent(hsv2rgb(H, S, Vv), 'wheel');
    };
    wh.addEventListener('pointerdown', (e) => { try { wh.setPointerCapture(e.pointerId); } catch (_) {} drag = true; pick(e); });
    wh.addEventListener('pointermove', (e) => { if (drag) pick(e); });
    const stop = () => { drag = false; };
    wh.addEventListener('pointerup', stop); wh.addEventListener('pointercancel', stop);
    $('valSl').addEventListener('input', (e) => { Vv = Number(e.target.value) / 100; drawWheel(); applyAccent(hsv2rgb(H, S, Vv), 'val'); });
    $('hexIn').addEventListener('input', (e) => { const rgb = fromHex(e.target.value); if (rgb) { [H, S, Vv] = rgb2hsv(rgb[0], rgb[1], rgb[2]); $('valSl').value = Math.round(Vv * 100); drawWheel(); applyAccent(rgb, 'hex'); } });
    $('accReset').onclick = () => applyAccent(fromHex(DEFAULT_ACCENT), 'reset');
    const pop = $('pop'), wb = $('wbtn');
    const setOpen = (o) => { pop.classList.toggle('open', o); wb.setAttribute('aria-expanded', o ? 'true' : 'false'); if (o) drawWheel(); };
    wb.addEventListener('click', (e) => { e.stopPropagation(); setOpen(!pop.classList.contains('open')); });
    document.addEventListener('pointerdown', (e) => { if (!pop.contains(e.target) && !wb.contains(e.target)) setOpen(false); });
    pop.addEventListener('keydown', (e) => { if (e.key === 'Escape') { setOpen(false); wb.focus(); } });
  })();

  // ==========================================================================
  // Build + main loop
  // ==========================================================================
  $('slotIn').appendChild(buildKnob('inGain'));
  const rest = $('slotRest');
  rest.appendChild(buildKnob('threshold'));
  rest.appendChild(buildKnob('knee'));
  { const dk = buildKnob('detail'); dk.classList.add('detailKn'); dk.querySelector('.ar').style.stroke = 'var(--comp)'; dk.querySelector('.lbl').style.color = 'var(--comp)'; rest.appendChild(dk); }
  const cw = document.createElement('div');
  cw.className = 'curve';
  cw.innerHTML = '<span>CURVE</span><canvas id="curveCv" aria-hidden="true"></canvas>';
  rest.appendChild(cw);
  {
    const sc = document.createElement('div');
    sc.className = 'sc';
    sc.innerHTML = '<div class="sch"><span>SPECTRUM</span><span class="lg"><span><i style="background:var(--accent)"></i>CLIPPED</span><span><i style="background:var(--comp)"></i>DETAIL KEPT</span></span></div>' +
      '<div class="scbox" id="scbox"><canvas id="scCv" aria-hidden="true"></canvas></div>';
    rest.appendChild(sc);
  }
  rest.appendChild(buildKnob('outGain'));

  function refreshAll() {
    const spec = isSpectral();
    if (spec !== wasSpectral) {
      // Spectral mode is one clipper over the whole signal: it uses band 1's threshold and knee.
      if (spec) { selBeforeSpectral = sel; sel = 0; } else { sel = Math.min(selBeforeSpectral, nBands() - 1); }
      wasSpectral = spec; ringBand = -1;
    }
    $('plugin').classList.toggle('spectral', spec);
    $('mSample').setAttribute('aria-pressed', spec ? 'false' : 'true');
    $('mSpec').setAttribute('aria-pressed', spec ? 'true' : 'false');
    if (sel >= nBands()) { sel = nBands() - 1; engine.setSel(sel); ringBand = -1; }
    renderKnobs(); renderBands(); renderOverlay();
  }

  let lastFrame = performance.now(), lastTxt = 0, inFlight = false, lastW = 0, lastH = 0;
  async function tick() {
    if (inFlight) return;
    inFlight = true;
    try {
      const band = sel;
      const fresh = ringBand !== band;
      if (fresh) { resetRing(); ringBand = band; }
      const want = Math.ceil(vizRate * 6.5);
      const res = await engine.poll(band, fresh ? 0 : now, want, true);
      const t = performance.now(), dt = Math.min(0.1, (t - lastFrame) / 1000); lastFrame = t;
      if (res.sr && res.sr !== engineSr) { engineSr = res.sr; }
      if (res.am !== undefined && res.am !== activeMode) { activeMode = res.am; ringBand = -1; }
      specMask = res.sm || null;
      $('switching').style.display = (isSpectral() ? 1 : 0) !== activeMode ? 'block' : 'none';
      // host-side parameter changes (automation, preset load)
      let changed = false;
      ORDER.forEach((id, i) => { const v = res.p[i]; if (!dragging.has(id) && v !== undefined && Math.abs(v - P[id]) > 1e-9) { P[id] = v; changed = true; } });
      if (changed) refreshAll();
      if (!V.frozen) {
        if (fresh) { now = res.from; haveFrom = res.from; }
        ingest(res, band);
        updMeter(mIn, res.mi, dt, t); updMeter(mOut, res.mo, dt, t);
        if (res.f) analyse(res.f, dt);
      }
      const box = $('scope');
      if (box.clientWidth !== lastW || box.clientHeight !== lastH) { lastW = box.clientWidth; lastH = box.clientHeight; renderOverlay(); positionBands(); }
      drawScope(); drawCurve();
      if (isSpectral()) drawSpecClip(dt); else drawSpectrum();
      drawMeter($('meterIn'), mIn); drawMeter($('meterOut'), mOut);
      if (!V.frozen && t - lastTxt > 120) {
        lastTxt = t;
        let gr = 0;
        const span = Math.min(now - haveFrom, Math.round(vizRate * 0.3));
        for (let i = 1; i <= span; i++) {
          const o = ((now - i) % CAP) * 4;
          const a = Math.max(Math.abs(ring[o]), Math.abs(ring[o + 1])), b = Math.max(Math.abs(ring[o + 2]), Math.abs(ring[o + 3]));
          if (a > 1e-4 && b > 1e-5 && a > b) { const d = 20 * Math.log10(a / b); if (d > gr) gr = d; }
        }
        $('grText').textContent = gr > 0.05 ? minus + gr.toFixed(1) + ' dB' : '0.0 dB';
        clipAct = Math.min(1, gr / 2);
        $('clipLbl').textContent = nBands() > 1 && !isSpectral() ? 'CLIP B' + (sel + 1) : 'CLIP';
        $('clipDot').style.background = gr > 0.1 ? accent : '#2A2A2A';
        $('inPk').textContent = fmtPk(mIn.hold);
        $('outPk').textContent = fmtPk(mOut.hold);
      }
    } catch (err) {
      console.error(err);
    } finally {
      inFlight = false;
    }
  }
  function loop() { tick(); requestAnimationFrame(loop); }

  async function start() {
    // Inside the plugin the native functions are bound once the web view is ready; wait for them.
    const inPlugin = () => !!window.__SCALPER_PLUGIN__;
    const t0 = performance.now();
    while (typeof window.scalperInit !== 'function') {
      const waited = performance.now() - t0;
      if (!inPlugin() && waited > 400) break;
      if (inPlugin() && waited > 10000) break;
      await new Promise((r) => setTimeout(r, 25));
    }
    engine = typeof window.scalperInit === 'function' ? NativeEngine : makeSimEngine();
    document.documentElement.dataset.engine = engine.name;
    const init = await engine.init();
    init.params.forEach((p) => { PDEF[p.id] = { min: p.min, max: p.max, def: p.def }; P[p.id] = p.v; });
    sel = Math.max(0, Math.min(nBands() - 1, init.sel || 0));
    vizRate = init.vizRate || 12000; engineSr = init.sr || 48000;
    applyAccent(fromHex(init.accent) || fromHex(DEFAULT_ACCENT), 'init');
    refreshAll();
    loop();
  }
  start();
})();
</script>
</body>
</html>
